<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article — Hi-Tech LMS</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .article-body { font-size:16px; line-height:1.8; color:var(--text-body); overflow-wrap: break-word; word-wrap: break-word; }
        .article-body h2, .article-body h3 { margin:32px 0 16px; color:var(--text-primary); font-weight:800; }
        .article-body h2 { font-size:24px; }
        .article-body h3 { font-size:20px; }
        .article-body p { margin-bottom:16px; }
        .article-body ul, .article-body ol { margin:16px 0 16px 24px; }
        .article-body li { margin-bottom:8px; }
        
        .helpful-section { background:var(--page-bg); border:1px solid var(--border-light); border-radius:12px; padding:24px; text-align:center; margin:40px 0; }
        
        .cta-box { background:#f0f9ff; border:1px solid #bae6fd; border-radius:12px; padding:32px; text-align:center; margin-top:32px; }
    </style>
</head>
<body>
<nav class="navbar" id="main-navbar"></nav>
<div id="toast-container"></div>

<main class="container page-content" style="max-width:860px;">
    <div class="breadcrumb" style="margin-bottom:24px;" id="breadcrumb">
        <a href="support.html">Help Center</a> <span class="breadcrumb-sep">/</span> <a href="support-knowledge-base.html">Knowledge Base</a> <span class="breadcrumb-sep">/</span> <span style="font-weight:600;color:var(--text-primary);" id="bc-title">Article</span>
    </div>

    <div id="loading" class="empty-state" style="padding:64px 0;"><p class="empty-state-title">Loading Article…</p></div>

    <div id="article-content" class="hidden">
        <div class="content-card" style="padding:40px 48px;">
            <div style="margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
                <span id="a-category" class="badge" style="background:var(--page-bg);color:var(--text-secondary);font-size:13px;font-weight:700;"></span>
                <span id="a-status" class="hidden"></span>
            </div>
            
            <h1 id="a-title" style="font-size:32px;font-weight:800;color:var(--text-primary);margin-bottom:16px;line-height:1.3;"></h1>
            
            <div style="font-size:14px;font-weight:600;color:var(--text-muted);margin-bottom:32px;padding-bottom:24px;border-bottom:2px solid var(--border-light);display:flex;gap:24px;flex-wrap:wrap;">
                <span id="a-meta"></span>
                <span id="a-stats" style="display:flex;gap:12px;"></span>
            </div>
            
            <div id="a-body" class="article-body"></div>

            <!-- Feedback -->
            <div class="helpful-section" id="feedback-section">
                <p style="font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:16px;">Was this article helpful?</p>
                <div style="display:flex;gap:12px;justify-content:center;">
                    <button class="btn btn-secondary outline" id="btn-yes" onclick="rate(true)" style="padding:10px 24px;">👍 Yes</button>
                    <button class="btn btn-secondary outline" id="btn-no" onclick="rate(false)" style="padding:10px 24px;">👎 No</button>
                </div>
                <div id="feedback-thanks" class="hidden" style="margin-top:16px;font-weight:700;color:var(--success);">Thank you for your feedback!</div>
            </div>

            <!-- CTA -->
            <div class="cta-box">
                <p style="font-size:18px;font-weight:800;color:#0369a1;margin-bottom:16px;">Still need help?</p>
                <a href="support-new-ticket.html" class="btn btn-primary" id="submit-ticket-btn" style="padding:12px 24px;font-size:15px;">Submit a Support Ticket</a>
            </div>
        </div>
    </div>
</main>

<footer class="site-footer" style="margin-top:80px;">
    <div class="container">
        <div class="footer-copy">&copy; 2026 Hi-Tech Institute. All rights reserved.</div>
        <div class="footer-links">
            <a href="#">Support</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>
    </div>
</footer>

<script src="js/common.js"></script>
<script>
    requireAuth();
    buildNavbar('support');

    const params = new URLSearchParams(window.location.search);
    const articleId = params.get('id');
    if (!articleId) window.location.href = 'support-knowledge-base.html';

    loadArticle();

    async function loadArticle() {
        try {
            const res = await apiCall(`/knowledge-base/${articleId}`);
            const a = res.data;
            hide(document.getElementById('loading'));
            show(document.getElementById('article-content'));

            document.getElementById('bc-title').textContent = a.title;
            document.getElementById('a-category').textContent = a.category;
            document.getElementById('a-title').textContent   = a.title;
            document.getElementById('a-meta').innerHTML    =
                `By <span style="color:var(--text-primary);">${a.authorName}</span> <span style="margin:0 8px;color:var(--border-dark);">|</span> Updated ${formatDate(a.updatedAt)} <span style="margin:0 8px;color:var(--border-dark);">|</span> v${a.version}`;
            document.getElementById('a-stats').innerHTML   =
                `<span>👁 ${a.viewCount} views</span> <span>👍 ${a.helpfulYes}</span>`;
            document.getElementById('a-body').innerHTML      = a.content;

            // Pass category to ticket form
            document.getElementById('submit-ticket-btn').href =
                `support-new-ticket.html?category=${a.category}`;

            // Staff status badge
            const role = getUserRole();
            if (role === 'SUPPORT_STAFF' || role === 'ADMIN') {
                const sb = document.getElementById('a-status');
                sb.innerHTML = getArticleStatusBadge(a.status);
                sb.classList.remove('hidden');
            }
        } catch(err) {
            document.getElementById('loading').innerHTML =
                `<div class="empty-state"><p class="empty-state-title" style="color:var(--danger)">Article not found.</p></div>`;
        }
    }

    async function rate(helpful) {
        try {
            await apiCall(`/knowledge-base/${articleId}/rate?helpful=${helpful}`, { method: 'POST' });
            document.querySelectorAll('#btn-yes,#btn-no').forEach(b => b.disabled=true);
            show(document.getElementById('feedback-thanks'));
        } catch(e) {}
    }
</script>
</body>
</html>
