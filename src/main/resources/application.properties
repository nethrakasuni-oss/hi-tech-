# =============================================
# HI-TECH LMS ? Application Configuration
# File: src/main/resources/application.properties
# =============================================

# ---- Server ----
server.port=8080

# ---- Application Name ----
spring.application.name=hitech-lms

# ---- MySQL Database Connection ----
# IMPORTANT: Change these to match your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/hitech_lms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:NewPass#123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# update = Hibernate auto-updates tables when entity changes (safe for development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true



# ---- Email (Gmail SMTP ? for local development) ----
# IMPORTANT: Use a Gmail account. Enable "App Password" in Google Account settings.
# Then set spring.mail.password to that App Password (NOT your Gmail login password).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:nethrakasuni@gmail.com}
spring.mail.password=${MAIL_PASSWORD:LiLi@2003}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ---- JWT Settings ----
# Secret key used to sign JWT tokens. Must be at least 256 bits (32+ chars).
# IMPORTANT: Change this to a long random string in production!
app.jwt.secret=${JWT_SECRET:hitech-lms-local-dev-secret-change-before-production-256-bits}
# JWT access token expiry: 1 hour (in milliseconds)
app.jwt.expiration-ms=3600000
# JWT refresh token expiry: 7 days (in milliseconds)
app.jwt.refresh-expiration-ms=604800000

# ---- Application Base URL (used in email links) ----
app.base-url=http://localhost:8080

# ---- Frontend Base URL (where HTML pages are served) ----
app.frontend-url=http://localhost:5500

# ---- Email Verification Token Expiry ----
# 24 hours in minutes
app.email-verification.expiry-minutes=1440

# ---- Password Reset Token Expiry ----
# 60 minutes
app.password-reset.expiry-minutes=60

# ---- File Upload Settings ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Logging ----
logging.level.com.hitech=DEBUG
logging.level.org.springframework.security=INFO

# ---- Finance Module Settings ----
# Tax rate percentage applied to every invoice (0 = tax exempt)
finance.tax-rate=0.00

# Institution details printed on every generated invoice
finance.institution-name=Hi-Tech Institute
finance.institution-address=No. 1, Hi-Tech Road, Colombo 03, Sri Lanka
finance.institution-phone=+94 11 234 5678
finance.institution-email=info@hitech.lk

# Mock payment gateway settings
# (Replace these values when integrating a real gateway)
# finance.stripe.secret-key=sk_test_...
# finance.stripe.webhook-secret=whsec_...
# finance.stripe.publishable-key=pk_test_...

# ---- Schedule Module Settings ----
# Maximum months ahead a session can be scheduled (FR-4.1)
schedule.max-advance-months=12

# Upcoming session reminder windows (hours before session)
schedule.reminder-hours-before=24,1

# ---- Machine Learning Prediction Module ----
# Python command used to run the local student performance predictor.
ml.python-command=python
# Directory that contains student_performance_predict.py and the .pkl model files.
ml.project-dir=.
ml.predict-script=student_performance_predict.py

